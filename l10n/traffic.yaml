  en: "Local proxy API unavailable"
  zh: "本地代理接口不可用"
health.unknown:
  en: "No active proxy outbound observed"
  zh: "尚未观测到活动代理出口"
health.stale:
  en: "Proxy probe expired; awaiting check"
  zh: "探测结果已过期，等待检查"
healthNote:
  en: "Proxy probes run every 10 seconds for up to 3 active outbounds. Yellow: ≥1500 ms, pending or partial failure. Red: API unavailable or two failed rounds. This does not guarantee every website is reachable."
  zh: "每 10 秒探测最多 3 个活动代理出口。黄灯：延迟 ≥1500 ms、待确认或部分异常；红灯：接口不可用或连续两轮失败。探测正常不代表所有网站均可访问。"
storageFailed:
  en: "Today's traffic could not be saved or restored. Check local disk access."
  zh: "今日统计保存或读取失败，请检查本地磁盘访问。"
