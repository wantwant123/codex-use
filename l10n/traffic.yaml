sampleNote:
  en: "Today's observed traffic uses local time and survives app restarts. Top totals include DIRECT. Rankings are sampled; short connections may be missed. Websites represent domains or IPs."
  zh: "按本机日期统计今日已观测流量，重启后继续累计。顶部总量包含直连；排行为采样统计，短连接可能漏记；网站指域名或 IP。"
gapNote:
